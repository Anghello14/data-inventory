# ETL Base Configuration - Flexible para múltiples tablas
# Cada tabla puede ser adaptada cambiando este YAML sin tocar el código

esquema_origen: SPE

# ============================================================================
# TABLAS A PROCESAR
# ============================================================================
# Estructura base: copiar una tabla existente y adaptar según necesidades
tablas:

  # EJEMPLO GENÉRICO 1: Tabla pequeña con PK y NOT NULL
  TABLA_EJEMPLO_1:
    descripcion: "Tabla de ejemplo con validaciones básicas"
    # Nombre de la columna que es clave primaria (será validada contra duplicados)
    pk: ID
    # Columnas que NO pueden tener nulos
    not_null:
      - ID
      - NOMBRE
    # Columnas que contienen datos sensibles (se marcarán en reportes)
    sensible: false
    # Columnas a excluir del perfilado (muy pesadas, BLOB, etc)
    # Si la columna está en Oracle, OracleReader la traerá como NULL
    exclude_from_profiling:
      - DESCRIPCION_LARGA
      - DATOS_ADJUNTOS
    # Validaciones personalizadas (regex, formatos específicos)
    # Clave = nombre_columna, Valor = tipo de validación (email, integer, etc)
    validaciones_campos:
      CORREO_CONTACTO: email
      EDAD: integer

  # EJEMPLO GENÉRICO 2: Tabla sin PK (datos maestro)
  TABLA_EJEMPLO_2:
    descripcion: "Tabla sin clave primaria"
    pk: null
    not_null: []
    sensible: true
    exclude_from_profiling: []
    validaciones_campos: {}

  # EJEMPLO GENÉRICO 3: Tabla con filtros y batch config
  TABLA_EJEMPLO_3:
    descripcion: "Tabla con configuración de batch"
    pk: ID
    not_null:
      - ID
    sensible: false
    exclude_from_profiling: []
    validaciones_campos: {}
    # Parámetros de extracción (OPCIONAL)
    # Si no se especifica, se extrae todo
    extraccion:
      # Límite de registros (null = sin límite)
      limite: null
      # Tamaño de batch para streaming (si en futuro se implementa paginación real)
      batch_size: 30000

# ============================================================================
# CONFIGURACIÓN GLOBAL DEL PIPELINE
# ============================================================================
pipeline:
  # Modo de ejecución: "strict" (falla si hay errors) o "tolerant" (continúa)
  modo: tolerant

  # Idempotencia: si el Excel ya existe, ¿saltamos la tabla?
  idempotencia: true

  # Umbrales de alerta (son solo informativos, no frenan el pipeline)
  umbrales:
    # Tablas con más de X registros se marcan como "masivas"
    masiva_desde: 1000000
    # Tablas con menos de X registros se marcan como "pocas"
    pocas_desde: 100
    # Si más del X% de registros es "dirty", alerta
    calidad_minima: 70

# ============================================================================
# CONFIGURACIÓN DE SALIDA
# ============================================================================
salida:
  # Directorio de salida (relativo a raíz del proyecto)
  directorio: data_output
  # Formato(s) de salida: excel, csv, ambos
  formato: excel
  # ¿Incluir pestaña de análisis técnico en Excel?
  incluir_analisis_tecnico: true
  # ¿Incluir pestaña de detalle de columnas?
  incluir_detalle_columnas: true
  # ¿Incluir pestaña con datos limpios?
  incluir_clean: true
  # ¿Incluir pestaña con datos dirty (rechazados)?
  incluir_dirty: true

# ============================================================================
# CONFIGURACIÓN DE LOGS
# ============================================================================
logs:
  directorio: logs
  nivel: INFO
  # Formato: "consola", "archivo", "ambos"
  salida: ambos
