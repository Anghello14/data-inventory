# ETL Base Configuration - Flexible para múltiples tablas
# Cada tabla puede ser adaptada cambiando este YAML sin tocar el código

esquema_origen: SPE

# ============================================================================
# TABLAS A PROCESAR
# ============================================================================
# Estructura base: copiar una tabla existente y adaptar según necesidades
tablas:

  # EJEMPLO 1: Tabla pequeña con salida en EXCEL
  TABLA_EJEMPLO_1:
    descripcion: "Tabla de ejemplo - salida Excel"
    pk: ID
    not_null:
      - ID
      - NOMBRE
    sensible: false
    exclude_from_profiling:
      - DESCRIPCION_LARGA
    validaciones_campos:
      CORREO: email
    salida:
      formato: excel          # Genera Excel (4 pestañas)

  # EJEMPLO 2: Tabla con salida en CSV (dos archivos: CLEAN.csv y DIRTY.csv)
  TABLA_EJEMPLO_2:
    descripcion: "Tabla con salida CSV"
    pk: ID
    not_null: []
    sensible: true
    exclude_from_profiling: []
    validaciones_campos: {}
    salida:
      formato: csv            # Genera dos CSVs: CLEAN.csv y DIRTY.csv

  # EJEMPLO 3: Tabla con salida DUAL (ambos formatos: Excel + CSV)
  TABLA_EJEMPLO_3:
    descripcion: "Tabla con salida dual (Excel + CSV)"
    pk: CODIGO
    not_null:
      - CODIGO
    sensible: false
    exclude_from_profiling: []
    validaciones_campos: {}
    salida:
      formato: dual           # o "ambos" - genera AMBOS formatos (Excel + CSV)

# ============================================================================
# CONFIGURACIÓN GLOBAL DEL PIPELINE
# ============================================================================
pipeline:
  # Modo de ejecución: "strict" (falla si hay errors) o "tolerant" (continúa)
  modo: tolerant

  # Idempotencia: si el archivo ya existe, ¿saltamos la tabla?
  idempotencia: false

  # Umbrales de alerta (son solo informativos, no frenan el pipeline)
  umbrales:
    masiva_desde: 1000000
    pocas_desde: 100
    calidad_minima: 70

# ============================================================================
# CONFIGURACIÓN DE SALIDA POR DEFECTO (puede ser overrideada en cada tabla)
# ============================================================================
salida:
  # Directorio de salida (relativo a raíz del proyecto)
  directorio: data_output

  # Formato(s) de salida: excel, csv, dual (o "ambos")
  # - excel: Genera un Excel con 4 pestañas
  # - csv: Genera dos CSVs (CLEAN.csv y DIRTY.csv)
  # - dual o ambos: Genera AMBOS formatos
  formato: excel

  # ¿Incluir pestaña de análisis técnico en Excel?
  incluir_analisis_tecnico: true

  # ¿Incluir pestaña de detalle de columnas?
  incluir_detalle_columnas: true

  # ¿Incluir datos limpios en la salida?
  incluir_clean: true

  # ¿Incluir datos dirty (rechazados) en la salida?
  incluir_dirty: true

# ============================================================================
# CONFIGURACIÓN DE LOGS
# ============================================================================
logs:
  directorio: logs
  nivel: INFO
  salida: ambos
